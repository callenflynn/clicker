<!DOCTYPE html>
<html>
<head>
    <title>clih — Flight Clicker</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
        button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #money { font-size: 28px; margin: 10px; }
        #income { color: #555; margin-bottom: 15px; }
        #clickBtn { font-size: 17px; padding: 14px 28px; }
        canvas {
            width: 100%;
            max-width: 640px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #222;
            background: #9ad0ff;
            cursor: pointer;
            margin-top: 15px;
        }
        .hint { color: #666; font-size: 13px; margin-top: 5px; }
        .shop { margin-top: 20px; }
        .item { margin: 8px; }
        .item button { min-width: 280px; }
        #toolbar { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>clih — Flight Clicker</h1>
    <div id="money">$0</div>
    <div id="income">$0 / sec</div>
    <button id="clickBtn">Click (+1)</button>

    <br>
    <canvas id="scene" width="320" height="150"></canvas>
    <div class="hint">Click the plane to earn money. Buy buildings to grow your city.</div>

    <div class="shop" id="shop"></div>
    <div id="toolbar">
        <button id="saveBtn">Save</button>
        <button id="resetBtn">Reset</button>
    </div>

    <script>
        const SAVE_KEY = 'clih-save';
        const PIXEL_W = 320, PIXEL_H = 150;
        const GROUND_Y = 128;

        // Building types (passive income, scaling price)
        const buildings = [
            { name: 'House',      baseCost: 15,     costMult: 1.15, income: 0.1 },
            { name: 'Shop',       baseCost: 100,    costMult: 1.15, income: 1   },
            { name: 'Apartment',  baseCost: 1100,   costMult: 1.15, income: 8   },
            { name: 'Office',     baseCost: 12000,  costMult: 1.15, income: 47  },
            { name: 'Skyscraper', baseCost: 130000, costMult: 1.15, income: 260 }
        ];

        const BUILDING_STYLES = [
            { w: 14, h: 16, body: '#8b3a3a', dark: '#5e2323' }, // House
            { w: 18, h: 20, body: '#7a4a2a', dark: '#4e2d18' }, // Shop
            { w: 16, h: 28, body: '#b07840', dark: '#7a4d22' }, // Apartment
            { w: 20, h: 34, body: '#6b6f76', dark: '#464a50' }, // Office
            { w: 22, h: 44, body: '#4d5a6b', dark: '#303b49' }  // Skyscraper
        ];

        let state = {
            money: 0,
            clickPower: 1,
            clickLevel: 0,
            buildings: buildings.map(() => 0)
        };

        const moneyEl = document.getElementById('money');
        const incomeEl = document.getElementById('income');
        const clickBtn = document.getElementById('clickBtn');
        const shopEl = document.getElementById('shop');
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let cpBtn = null;
        let buildingBtns = [];

        // ---- scene animation state ----
        const planeW = 19, planeH = 12;
        let planeX = Math.floor(PIXEL_W / 2 - planeW / 2);
        let planeY = 46;
        let frame = 0;
        let scrollX = 0;
        let floaters = [];

        const clouds = [
            { x: 40,  y: 25, w: 12 },
            { x: 130, y: 15, w: 8  },
            { x: 230, y: 40, w: 16 }
        ];

        // ---- helpers ----
        function buildingCost(i) {
            return Math.floor(buildings[i].baseCost * Math.pow(buildings[i].costMult, state.buildings[i]));
        }
        function clickCost() {
            return Math.floor(10 * Math.pow(1.5, state.clickLevel));
        }
        function incomePerSec() {
            return buildings.reduce((sum, b, i) => sum + b.income * state.buildings[i], 0);
        }
        function fmt(n) {
            if (n < 1000) return Math.floor(n).toString();
            const units = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
            let i = -1;
            while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
            return n.toFixed(2).replace(/\.?0+$/, '') + units[i];
        }
        function getBuildingInstances() {
            const list = [];
            let x = 0;
            buildings.forEach((b, tier) => {
                const s = BUILDING_STYLES[tier];
                for (let i = 0; i < state.buildings[tier]; i++) {
                    list.push({ tier, x });
                    x += s.w + 8;
                }
            });
            return { list, width: Math.max(x, PIXEL_W) };
        }

        // ---- buy actions ----
        function buyClickPower() {
            if (state.money >= clickCost()) {
                state.money -= clickCost();
                state.clickLevel++;
                state.clickPower++;
                update();
            }
        }
        function buyBuilding(i) {
            if (state.money >= buildingCost(i)) {
                state.money -= buildingCost(i);
                state.buildings[i]++;
                update();
            }
        }

        // ---- shop UI (built once) ----
        function createShop() {
            const cpDiv = document.createElement('div');
            cpDiv.className = 'item';
            cpBtn = document.createElement('button');
            cpBtn.onclick = buyClickPower;
            cpDiv.appendChild(cpBtn);
            shopEl.appendChild(cpDiv);

            buildingBtns = buildings.map((b, i) => {
                const div = document.createElement('div');
                div.className = 'item';
                const btn = document.createElement('button');
                btn.onclick = () => buyBuilding(i);
                div.appendChild(btn);
                shopEl.appendChild(div);
                return btn;
            });
        }

        function update() {
            moneyEl.textContent = '$' + fmt(state.money);
            incomeEl.textContent = '$' + fmt(incomePerSec()) + ' / sec';
            clickBtn.textContent = 'Click (+' + state.clickPower + ')';

            cpBtn.textContent = 'Click Power (lvl ' + state.clickLevel + ') - $' + fmt(clickCost());
            cpBtn.disabled = state.money < clickCost();

            buildings.forEach((b, i) => {
                buildingBtns[i].textContent = b.name + ' (' + state.buildings[i] + ') - $' + fmt(buildingCost(i));
                buildingBtns[i].disabled = state.money < buildingCost(i);
            });
        }

        // ---- pixel-art drawing ----
        function drawBrickBuilding(x, y, w, h, body, dark) {
            ctx.fillStyle = body;
            ctx.fillRect(x, y, w, h);

            ctx.fillStyle = dark;
            const brickH = 3;
            for (let row = 0; row * brickH < h; row++) {
                const yy = y + row * brickH;
                ctx.fillRect(x, yy, w, 1);
                const off = (row % 2) * 3;
                for (let col = off; col < w; col += 6) {
                    ctx.fillRect(x + col, yy, 1, brickH);
                }
            }

            ctx.fillStyle = '#ffd23f';
            for (let wx = x + 2; wx < x + w - 2; wx += 5) {
                for (let wy = y + 3; wy < y + h - 4; wy += 6) {
                    ctx.fillRect(wx, wy, 2, 3);
                }
            }

            if (w >= 20) { // chimney for big buildings
                ctx.fillStyle = dark;
                ctx.fillRect(x + w - 6, y - 5, 3, 5);
                ctx.fillStyle = '#999';
                ctx.fillRect(x + w - 6, y - 6, 3, 1);
            }
        }

        function drawPlane(x, y) {
            ctx.fillStyle = '#d33';
            ctx.fillRect(x + 1, y + 1, 2, 2);            // tail fin
            ctx.fillStyle = '#a0a0a8';
            ctx.fillRect(x + 2, y + 3, 3, 3);            // tail
            ctx.fillStyle = '#c8c8d0';
            ctx.fillRect(x + 4, y + 5, 12, 3);           // fuselage
            ctx.fillRect(x + 13, y + 6, 4, 1);           // nose
            ctx.fillStyle = '#888894';
            ctx.fillRect(x + 7, y + 2, 5, 1);            // top wing
            ctx.fillRect(x + 7, y + 9, 5, 1);            // bottom wing
            ctx.fillStyle = '#d33';
            ctx.fillRect(x + 4, y + 5, 12, 1);           // stripe
            ctx.fillStyle = '#7cd8ff';
            ctx.fillRect(x + 14, y + 6, 2, 1);           // window
            ctx.fillStyle = '#333';
            if (frame % 6 < 3) {                          // spinning propeller
                ctx.fillRect(x + 17, y + 4, 1, 6);
            } else {
                ctx.fillRect(x + 17, y + 6, 1, 1);
                ctx.fillRect(x + 17, y + 9, 1, 1);
            }
        }

        function drawScene() {
            // sky
            ctx.fillStyle = '#9ad0ff';
            ctx.fillRect(0, 0, PIXEL_W, GROUND_Y);
            // ground
            ctx.fillStyle = '#3f9b3f';
            ctx.fillRect(0, GROUND_Y, PIXEL_W, PIXEL_H - GROUND_Y);
            ctx.fillStyle = '#358335';
            ctx.fillRect(0, GROUND_Y, PIXEL_W, 2);

            // scrolling grass tufts (ground parallax)
            ctx.fillStyle = '#2f7a2f';
            for (let i = 0; i < 8; i++) {
                const gx = ((i * 45 - scrollX) % PIXEL_W + PIXEL_W) % PIXEL_W;
                ctx.fillRect(gx, GROUND_Y + 5, 2, 4);
            }

            // clouds (slow parallax)
            ctx.fillStyle = '#ffffff';
            clouds.forEach(c => {
                const span = PIXEL_W + 40;
                const cx = ((c.x - scrollX * 0.4) % span + span) % span - 20;
                ctx.fillRect(cx, c.y, c.w, 4);
            });

            // buildings scrolling right -> left
            const { list, width } = getBuildingInstances();
            list.forEach(b => {
                const s = BUILDING_STYLES[b.tier];
                const sx = ((b.x - scrollX) % width + width) % width;
                drawBrickBuilding(sx, GROUND_Y - s.h, s.w, s.h, s.body, s.dark);
                drawBrickBuilding(sx - width, GROUND_Y - s.h, s.w, s.h, s.body, s.dark);
            });

            // plane centered, bobbing
            planeX = Math.floor(PIXEL_W / 2 - planeW / 2);
            planeY = 46 + Math.round(Math.sin(frame * 0.04) * 4);
            drawPlane(planeX, planeY);

            // floating +$ text
            floaters.forEach(f => {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(f.x, f.y, f.text.length * 5 + 4, 8);
                ctx.fillStyle = '#fff';
                ctx.font = '7px monospace';
                ctx.fillText(f.text, f.x + 2, f.y + 7);
            });
        }

        function animate() {
            frame++;
            scrollX += 1.2;

            floaters = floaters.filter(f => f.life > 0);
            floaters.forEach(f => { f.y -= 0.5; f.life--; });

            drawScene();
            requestAnimationFrame(animate);
        }

        // ---- click the plane ----
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = (e.clientX - rect.left) * (PIXEL_W / rect.width);
            const py = (e.clientY - rect.top) * (PIXEL_H / rect.height);

            if (px >= planeX && px <= planeX + planeW && py >= planeY && py <= planeY + planeH) {
                state.money += state.clickPower;
                floaters.push({ x: planeX, y: planeY, text: '+' + state.clickPower, life: 40 });
                update();
            }
        });

        // ---- fallback button + save/reset ----
        clickBtn.onclick = () => {
            state.money += state.clickPower;
            update();
        };

        document.getElementById('resetBtn').onclick = () => {
            if (!confirm('Reset all progress?')) return;
            state = { money: 0, clickPower: 1, clickLevel: 0, buildings: buildings.map(() => 0) };
            save();
            update();
        };

        document.getElementById('saveBtn').onclick = save;

        function save() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        }
        function load() {
            try {
                const data = JSON.parse(localStorage.getItem(SAVE_KEY));
                if (!data) return;
                state.money = data.money ?? 0;
                state.clickPower = data.clickPower ?? 1;
                state.clickLevel = data.clickLevel ?? 0;
                state.buildings = data.buildings ?? buildings.map(() => 0);
                while (state.buildings.length < buildings.length) state.buildings.push(0);
                state.buildings.length = buildings.length;
            } catch (e) {}
        }

        // ---- idle income + auto-save ----
        setInterval(() => {
            state.money += incomePerSec() / 10;
            update();
        }, 100);
        setInterval(save, 5000);

        load();
        createShop();
        update();
        animate();
    </script>
    <div id="version">v__VERSION__</div>
</body>
</html>
