<!DOCTYPE html>
<html>
<head>
    <title>clih</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>clih</h1>
    <div id="money">$0</div>
    <div id="income">$0 / sec</div>
    <canvas id="scene" width="320" height="150"></canvas>
    <div class="hint">Click the plane to earn money. Buy buildings to grow your city.</div>

    <div id="toolbar">
        <button id="resetBtn">Reset</button>
    </div>

    <!-- slideout shop -->
    <button id="shopToggle" class="shop-toggle">🛒 Shop</button>
    <div id="shopBackdrop" class="shop-backdrop"></div>
    <div id="shopPanel" class="shop-panel">
        <div class="shop-head">
            <span>Shop</span>
            <button id="shopClose" class="shop-close">×</button>
        </div>
        <div class="shop" id="shop">
            <div class="buy-modes" id="buyModes"></div>
            <div id="shopItems"></div>
            <div class="stats" id="stats"></div>
            <div class="achievements" id="achievements"></div>
        </div>
    </div>
    <div id="toasts"></div>

    <script src="script.js"></script>
    <div id="version">v__VERSION__</div>
</body>
</html>
